<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberto Biscalchin - Researcher</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="universe">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>

        <div id="scene">
            <!-- Central Star (Profile) -->
            <div id="center-star-container">
                <div id="sun-glow"></div>
                <div id="profile-star">
                    <img src="img/prof_pic.png" alt="Alberto Biscalchin" id="profile-img">
                </div>
                <div id="profile-info">
                    <h1 id="name"></h1>
                    <p id="subtitle"></p>
                    <div id="uni-logo-container">
                        <span id="uni-text"></span>
                    </div>
                </div>
            </div>

            <!-- Orbit System (Visual Ring) -->
            <div id="orbit-system"></div>

            <!-- Planet Layer (3D Billboarded Planets) -->
            <div id="planet-layer"></div>
        </div>

        <!-- Pop-up Panel Overlay -->
        <div id="panel-overlay" class="hidden">
            <div id="content-panel">
                <button id="close-btn">&times;</button>
                <div id="panel-content">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
